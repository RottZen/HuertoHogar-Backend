spring.application.name=pedido-service
server.port=8082

# --- Base de datos (MySQL local o AWS RDS). Se configura por variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
server.error.include-binding-errors=always

app.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# URLs de los otros microservicios
servicios.producto.url=${PRODUCTO_URL:http://localhost:8080}
servicios.usuario.url=${USUARIO_URL:http://localhost:8081}
