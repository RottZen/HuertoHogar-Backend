spring.application.name=producto-service
server.port=8080

# --- Base de datos: por defecto H2 en archivo (no requiere instalar nada).
# Para MySQL/RDS define DB_URL, DB_USER y DB_PASSWORD (ver README) ---
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/huertohogar_productos;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mensajes de error utiles para el frontend
server.error.include-message=always
server.error.include-binding-errors=always

# Origenes permitidos (cualquier puerto de localhost: Vite puede usar 5173, 5174...)
app.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
