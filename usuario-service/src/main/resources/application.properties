spring.application.name=usuario-service
server.port=8081

# --- Base de datos (MySQL local o AWS RDS). Se configura por variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
server.error.include-binding-errors=always

app.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# JWT
app.security.jwt.secret=${JWT_SECRET:huertohogar-super-secreto-para-jwt-minimo32chars-ok}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
